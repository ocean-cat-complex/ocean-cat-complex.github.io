# Hugo Configuration - YongXiang Chen Research Group
title: "YongXiang Chen Research Group"
baseURL: "/"
languageCode: "en-us"
defaultContentLanguage: "en"

# Build settings
enableRobotsTXT: true
enableEmoji: true
enableGitInfo: false

# Pagination
pagination:
  pagerSize: 10

# Permalinks
permalinks:
  posts: "/posts/:slug/"

# Menu
menu:
  main:
    - name: "Home"
      url: "/"
      weight: 1
    - name: "Research"
      url: "/research/"
      weight: 2
    - name: "Members"
      url: "/members/"
      weight: 3
    - name: "Publications"
      url: "/publications/"
      weight: 4

# Markup
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: github

# Minify
minify:
  disableXML: true
  minifyOutput: true
