<header class="navbar">
  <div class="container">
    <nav class="nav-container">
      <!-- Logo -->
      <a href="/" class="nav-logo">
        YongXiang Chen Group
      </a>
      
      <!-- Desktop Navigation -->
      <div class="desktop-nav">
        {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" class="nav-link{{ if $.IsMenuCurrent "main" . }} active{{ end }}">
          {{ .Name }}
        </a>
        {{ end }}
      </div>
      
      <!-- Right side: Dark mode toggle + Mobile menu -->
      <div class="nav-actions">
        <!-- Dark mode toggle -->
        <button id="dark-toggle" class="dark-toggle" aria-label="Toggle dark mode">
          <svg id="sun-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        
        <!-- Mobile menu button -->
        <button id="menu-toggle" class="dark-toggle mobile-only" aria-label="Toggle menu">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </nav>
    
    <!-- Mobile Navigation -->
    <div id="mobile-menu" class="hidden mobile-menu-items">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL }}" class="mobile-nav-link">
        {{ .Name }}
      </a>
      {{ end }}
    </div>
  </div>
</header>

<!-- Spacer for fixed header -->
<div class="header-spacer"></div>
